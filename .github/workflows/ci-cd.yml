name: Progree CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test || true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t progree-devops-app:${{ github.sha }} .

      - name: Verify Image Built
        run: docker images progree-devops-app

  deployment-status:
    name: Deployment Status Board
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Log Deployment Metrics
        run: |
          echo "=================================="
          echo "   PROGREE DEPLOYMENT BOARD"
          echo "=================================="
          echo "Status    : SUCCESS"
          echo "App       : progree-devops-app"
          echo "Version   : ${{ github.sha }}"
          echo "Branch    : ${{ github.ref_name }}"
          echo "Actor     : ${{ github.actor }}"
          echo "Timestamp : $(date)"
          echo "=================================="
